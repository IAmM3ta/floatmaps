<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FloatMaps</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<style>
  /* Basic styling - you can expand this */
  body { font-family: system-ui, sans-serif; background: #0a0a0a; color: white; }
  .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body>

<h1 style="text-align:center; padding:20px;">FloatMaps</h1>

<!-- Auth Section -->
<div id="auth-section" class="p-4 glass rounded-2xl mb-6 max-w-md mx-auto">
  <div id="auth-forms">
    <div id="login-form">
      <h3 class="text-lg font-semibold mb-3">Login</h3>
      <input id="login-email" type="email" placeholder="Email" class="w-full mb-2 p-2 rounded bg-white/5 border border-white/10">
      <input id="login-password" type="password" placeholder="Password" class="w-full mb-3 p-2 rounded bg-white/5 border border-white/10">
      <button onclick="login()" class="w-full py-2 bg-[#67f6ff] text-black rounded-xl mb-2">Login</button>
      <button onclick="loginWithGoogle()" class="w-full py-2 border border-white/20 rounded-xl mb-3 flex items-center justify-center gap-2">Continue with Google</button>
      <p class="text-xs text-center">Don't have an account? <span onclick="showRegister()" class="text-[#67f6ff] cursor-pointer">Register</span></p>
    </div>
    <div id="register-form" class="hidden">
      <h3 class="text-lg font-semibold mb-3">Create Account</h3>
      <input id="register-email" type="email" placeholder="Email" class="w-full mb-2 p-2 rounded bg-white/5 border border-white/10">
      <input id="register-password" type="password" placeholder="Password" class="w-full mb-3 p-2 rounded bg-white/5 border border-white/10">
      <button onclick="register()" class="w-full py-2 bg-[#67f6ff] text-black rounded-xl mb-2">Create Account</button>
      <p class="text-xs text-center">Already have an account? <span onclick="showLogin()" class="text-[#67f6ff] cursor-pointer">Login</span></p>
    </div>
  </div>
  <div id="user-info" class="hidden">
    <p class="text-sm">Logged in as: <span id="user-email" class="font-mono"></span></p>
    <button onclick="logout()" class="mt-2 text-xs px-3 py-1 border border-white/20 rounded">Logout</button>
    <button onclick="showProfile()" class="mt-2 ml-2 text-xs px-3 py-1 border border-white/20 rounded">Profile</button>
  </div>
</div>

<!-- Route Creation Tools -->
<div id="route-tools" class="glass p-4 rounded-2xl mt-6 max-w-md mx-auto">
  <h3 class="font-semibold mb-2">Create Route</h3>
  <p class="text-xs text-white/60 mb-3">Click on the map to add points, then save.</p>
  <div class="flex gap-2">
    <button onclick="startDrawingRoute()" class="flex-1 py-2 bg-white/10 rounded-xl text-sm">Start Drawing</button>
    <button onclick="saveCurrentRoute()" class="flex-1 py-2 bg-[#67f6ff] text-black rounded-xl text-sm">Save Route</button>
    <button onclick="clearCurrentRoute()" class="px-3 py-2 border border-white/20 rounded-xl text-sm">Clear</button>
  </div>
  <input id="route-name" type="text" placeholder="Route name (optional)" class="w-full mt-3 p-2 rounded bg-white/5 border border-white/10 text-sm">
</div>

<!-- Your original Three.js + Leaflet map code should go here -->
<div id="map-container" style="height: 600px; width: 100%;">
  <p style="text-align:center; padding:40px;">Map will load here once you restore your Three.js / Leaflet code</p>
</div>

<script src="auth-and-routes.js"></script>

</body>
</html>
