name: Validate WebMCP Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # Needed to comment on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check webmcp.js

      - name: Run advanced WebMCP validator
        id: validate
        run: npm run validate:webmcp
        continue-on-error: true

      - name: Comment on PR if validation fails
        if: steps.validate.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('WebMCP validation failed')
            );
            
            const body = `## ❌ WebMCP Validation Failed

The WebMCP tool validation failed on this PR.

Please check the **Actions** tab for details and fix the issues in your tools.

Common issues:
- Missing or invalid \`inputSchema\`
- Missing \`execute\` function
- Schema validation errors

Run locally: \`npm run validate:webmcp\``;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
