name: Validate WebMCP Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: node --check webmcp.js

      - name: Run advanced WebMCP schema validator
        run: node scripts/validate-webmcp.js

      - name: Summary
        if: always()
        run: echo "WebMCP validation completed. Check logs above for details."
